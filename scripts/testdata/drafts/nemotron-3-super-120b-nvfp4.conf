# NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 — hybrid Mamba/LatentMoE, 75 GB NVFP4,
# ~12.8 GB active/token -> roofline ~19 tok/s. Validated here at ~16.2 tok/s
# c=1 base and 113 agg @ c=32 (see docs/VALIDATION.md / README table).
MODEL="nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
SERVED_NAME="nemotron-3-super"
NODES=1
PORT=8000
GPU_MEM_UTIL=0.85
ENGINE_ARGS=(
  --max-model-len 32768        # the tested length; config allows 262144 (untested)
  --max-num-seqs 32
  --kv-cache-dtype fp8         # NOTE: checkpoint has no k/v scales (factor 1.0)
  --moe-backend marlin
)
CONTAINER_ENV=(
  "VLLM_MARLIN_USE_ATOMIC_ADD=1"
)
# SPEC DECODE: VALIDATED WIN 2026-07-31 — MTP k=1 = +47% tok/s (23.7 vs 16.1
# c=1, +21% at c=4, 86.6% acceptance) with fixed metering + natural prompts.
# (The earlier "-21%" was harness chunk-counting error — TROUBLESHOOTING.md.)
# Opt-in via ./serve.sh ... --spec-decode (launcher does not enable SPEC_* by default).
SPEC_DECODE_ARGS=(
  --speculative-config '{"method":"mtp","num_speculative_tokens":1,"moe_backend":"triton"}'
)
STATUS="tested"
WEIGHTS_GIB=75
OVERHEAD_GIB=12
MEM_MIN_FREE_GIB=8
