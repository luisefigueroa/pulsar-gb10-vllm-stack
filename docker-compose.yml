# UNSUPPORTED. Not an operator path.
# Canonical launch is `./pulsar start <profile>` (or `./serve.sh <profile>`).
# This historical sketch does not load a profile or enforce STATUS/placement,
# exact revision/seal identity, read-only runtime views, preflight gates, or
# Pulsar ownership/launch/topology labels. It also ignores VLLM_IMAGE_MAINLINE
# and VLLM_API_KEY and names the container `vllm-server`.
# Home, wizard, and down.sh will not manage it. Its shared GPU/IPC/health
# settings do not make it equivalent to a Pulsar-managed launch.
#
# Multi-node serving lives in cluster/. Do not use this file for lab serving;
# use `./pulsar start`.
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.26.0}
    container_name: vllm-server
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${MODELS_NFS:-/mnt/Models}:/mnt/Models:ro
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      VLLM_LOGGING_LEVEL: ${VLLM_LOGGING_LEVEL:-INFO}
    command: >
      --model ${MODEL:-Qwen/Qwen3.6-27B-FP8}
      --served-model-name ${SERVED_NAME:-qwen3.6-27b-fp8}
      --host 0.0.0.0 --port ${PORT:-8000}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.80}
      ${ENGINE_ARGS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: ${HEALTH_START_PERIOD:-900s}
    restart: ${RESTART_POLICY:-unless-stopped}
