# Single-node standing service. `./serve.sh <model>` is the canonical launcher
# (it knows per-model flags); this compose file is for the boring case of one
# long-lived local server, wired the same way: nvidia runtime, host IPC,
# unlimited memlock, HF cache from the host, /health healthcheck.
#
# Configure via .env (see .env.example): VLLM_IMAGE, MODEL, SERVED_NAME, PORT,
# GPU_MEM_UTIL, ENGINE_ARGS (single string), HF_TOKEN.
#
# Docker Compose does NOT span hosts. 2-node serving lives in cluster/.
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.26.0}
    container_name: vllm-server
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${MODELS_NFS:-/mnt/Models}:/mnt/Models:ro
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      VLLM_LOGGING_LEVEL: ${VLLM_LOGGING_LEVEL:-INFO}
    command: >
      --model ${MODEL:-Qwen/Qwen3.6-27B-FP8}
      --served-model-name ${SERVED_NAME:-qwen3.6-27b-fp8}
      --host 0.0.0.0 --port ${PORT:-8000}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.80}
      ${ENGINE_ARGS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:${PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: ${HEALTH_START_PERIOD:-900s}
    restart: ${RESTART_POLICY:-unless-stopped}
