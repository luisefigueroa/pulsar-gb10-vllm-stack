# Laguna-S-2.1-NVFP4 TP=2 across both nodes — NOT a ship path.
#
# Historical / lab uses only:
#   1. 1-node vs 2-node greedy-parity gates (docs/VALIDATION.md)
#   2. measuring cross-node TP economics for a model that fits one node
#
# Stock official image: CUDA-graph path hangs cross-node TP=2 without
# --enforce-eager (shm_broadcast / graph capture; see VALIDATION.md,
# MULTINODE.md). Even with eager, decode is ~2x slower — prefer
# single-node laguna-s-2.1-nvfp4 for real serving.
#
# STATUS is do-not-use so scripts/up|serve|start-cluster refuse without
# --force. If you deliberately run a measurement:
#   VLLM_EXTRA_ARGS="--enforce-eager" cluster/start-cluster.sh laguna-s-2.1-2node --force
MODEL="/mnt/Models/Official Models/poolside/Laguna-S-2.1-NVFP4"
SERVED_NAME="laguna-s-2.1"
NODES=2
TOPOLOGY_CLASS="roce-full-mesh"
MIN_RAILS_PER_PAIR=2
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --max-model-len 262144
  --max-num-seqs 4
  --moe-backend marlin
  --tensor-parallel-size 2
  --distributed-executor-backend mp
  # Required on stock vllm/vllm-openai for cross-node TP=2 (do not remove
  # if you force-start). Still not a production recipe — use 1-node conf.
  --enforce-eager
)
STATUS="do-not-use"
NOTES="Cross-node TP measurement only. Stock graphs hang without --enforce-eager (now in ENGINE_ARGS). Prefer laguna-s-2.1-nvfp4 (1-node). Launch requires --force; not ship-default."
