# Laguna-S-2.1-NVFP4 split TP=2 across both nodes. Two purposes:
# 1. the 1-node-vs-2-node greedy-parity gate (docs/VALIDATION.md) with a
#    standard-attention model (the GDN-hybrid 27B hangs cross-node),
# 2. measuring cross-node TP economics for a model that fits one node.
# For real serving prefer the single-node laguna-s-2.1-nvfp4.
MODEL="/mnt/Models/Official Models/poolside/Laguna-S-2.1-NVFP4"
SERVED_NAME="laguna-s-2.1"
NODES=2
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --max-model-len 262144
  --max-num-seqs 4
  --moe-backend marlin
  --tensor-parallel-size 2
  --distributed-executor-backend mp
)
STATUS="untested"
