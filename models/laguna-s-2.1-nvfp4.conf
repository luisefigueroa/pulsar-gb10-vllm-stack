# poolside Laguna-S-2.1-NVFP4 — 118B/A8B MoE, 72 GB NVFP4 + FP8 KV scheme in
# checkpoint. The ONLY model in the official NFS catalog that fits a node as
# shipped: full 262K context with headroom. Ships a DFlash draft (spec decode).
# Roofline: ~9.8 GB active/token -> ~24 tok/s single-stream.
MODEL="/mnt/Models/Official Models/poolside/Laguna-S-2.1-NVFP4"
SERVED_NAME="laguna-s-2.1"
NODES=1
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --max-model-len 262144
  --max-num-seqs 4
  --moe-backend marlin          # NVFP4 MoE: CUTLASS is silently wrong on sm_121
)
CONTAINER_ENV=(
  "VLLM_MARLIN_USE_ATOMIC_ADD=1"
)
# The checkpoint's generation_config wires DFlash with k=15; the matching draft
# for THIS quantization is Laguna-S-2.1-DFlash-NVFP4 (2.2 GB, BF16 weights).
SPEC_DECODE_ARGS=(
  --speculative-config '{"method":"dflash","model":"/mnt/Models/Official Models/poolside/Laguna-S-2.1-DFlash-NVFP4","num_speculative_tokens":15}'
)
STATUS="untested"
