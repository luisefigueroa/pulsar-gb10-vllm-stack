# Qwen3.6-27B-FP8 split TP=2 across both nodes. Exists for two reasons:
# 1. the 1-node-vs-2-node output-parity gate in docs/VALIDATION.md (same
#    model both ways), 2. measuring what cross-node TP actually buys/costs
#    on a dense model at this size (see docs/TUNING.md).
# Not the recommended way to serve a 29 GB model (it fits one node).
MODEL="Qwen/Qwen3.6-27B-FP8"
SERVED_NAME="qwen3.6-27b-fp8"
NODES=2
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --max-model-len 131072
  --max-num-seqs 16
  --tensor-parallel-size 2
  --distributed-executor-backend mp
)
STATUS="do-not-use"
NOTES="FAILED 2026-07-28: GDN hybrids hang cross-node TP=2 (sample_tokens RPC timeout, wrong output first). Kept as regression test only."
