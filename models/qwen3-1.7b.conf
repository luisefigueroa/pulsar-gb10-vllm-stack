# Qwen3-1.7B — tiny BF16 dense model. Not a serving target; this is the
# end-to-end smoke test and determinism canary (fast to load, fast to fail).
MODEL="Qwen/Qwen3-1.7B"
SERVED_NAME="qwen3-1.7b"
NODES=1
PORT=8000
GPU_MEM_UTIL=0.30            # tiny model; leave the machine usable
ENGINE_ARGS=(
  --max-model-len 32768
  --max-num-seqs 16
)
STATUS="tested"
FIRST_RUN_CANDIDATE=1
WEIGHTS_GIB=4
KV_GIB=2
OVERHEAD_GIB=6
MEM_MIN_FREE_GIB=8
NOTES="smoke-test model"
