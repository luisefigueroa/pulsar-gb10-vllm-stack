# DeepSeek-V4-Flash-0731 — CANDIDATE to replace the flagship (released
# 2026-07-31, claimed major improvements). Same architecture as V4-Flash
# (DeepseekV4ForCausalLM, 43 layers, 166.9 GB FP8+FP4) and — new — the
# DSpark drafter is BUILT INTO this checkpoint (dspark_block_size 5,
# markov_rank 256, target layers 40-42); no separate -DSpark variant.
# Serves on the PR-41834 image (contains the sm_121 DSA path).
#
# Gates to earn "tested" (A/B against the incumbent's numbers):
# base 27.15 tok/s c=1 / DSpark 48.4 / gsm8k 0.945 / needle 3/3 @447K.
MODEL="deepseek-ai/DeepSeek-V4-Flash-0731"
SERVED_NAME="deepseek-v4-flash-0731"
IMAGE="vllm-gb10:pr41834-d64074e6f"
IMAGE_KIND="openai"
NODES=2
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --trust-remote-code
  --tensor-parallel-size 2
  --kv-cache-dtype fp8          # required by the DSV4 fp8_ds_mla KV layout
  --block-size 256
  --max-model-len 131072        # validation length; extend after needle gates
  --max-num-seqs 8
  --max-num-batched-tokens 8192
  --enable-prefix-caching
  --distributed-executor-backend mp
)
SPEC_DECODE_ARGS=(
  --speculative-config '{"method":"dspark","num_speculative_tokens":5}'
)
STATUS="untested"
NOTES="candidate flagship; validate then A/B against deepseek-v4-flash + -dspark before any promotion"
