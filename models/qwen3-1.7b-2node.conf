# Qwen3-1.7B split TP=2 across both nodes. Pointless for production (the model
# fits in a fraction of one node) — this is the multi-node plumbing canary:
# it validates torch.distributed bootstrap, NCCL-over-RoCE, and the mp
# executor in minutes instead of the ~10 min a real model takes to load.
MODEL="Qwen/Qwen3-1.7B"
SERVED_NAME="qwen3-1.7b-2node"
PROFILE_FAMILY="qwen3-1.7b"
VARIANT_LABEL="2-node plumbing canary"
PROFILE_PURPOSE="diagnostic"
NODES=2
TOPOLOGY_CLASS="roce-full-mesh"
MIN_RAILS_PER_PAIR=2
PORT=8000
GPU_MEM_UTIL=0.30
ENGINE_ARGS=(
  --max-model-len 32768
  --max-num-seqs 16
  --tensor-parallel-size 2
  --distributed-executor-backend mp
)
STATUS="tested"
NOTES="plumbing canary, not a serving target"
