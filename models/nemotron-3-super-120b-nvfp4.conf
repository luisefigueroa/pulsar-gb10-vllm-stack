# NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 — hybrid Mamba/LatentMoE, 75 GB NVFP4,
# ~12.8 GB active/token -> roofline ~19 tok/s. Prior art on this box (Opus repo)
# measured 16.48 tok/s @ c=1 and 162.9 tok/s aggregate @ c=32 with these flags.
MODEL="nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4"
SERVED_NAME="nemotron-3-super"
NODES=1
PORT=8000
GPU_MEM_UTIL=0.85
ENGINE_ARGS=(
  --max-model-len 32768        # the tested length; config allows 262144 (untested)
  --max-num-seqs 32
  --kv-cache-dtype fp8         # NOTE: checkpoint has no k/v scales (factor 1.0)
  --moe-backend marlin
)
CONTAINER_ENV=(
  "VLLM_MARLIN_USE_ATOMIC_ADD=1"
)
# SPEC DECODE: measured 2026-07-28 — MTP k=1 lossless (97.5% acceptance!) but
# -21% tok/s: the BF16 MTP head costs more bandwidth than it saves. Ships OFF.
STATUS="tested"
