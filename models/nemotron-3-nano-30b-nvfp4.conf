# NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4 — hybrid Mamba/MoE, 18 GB NVFP4,
# ~3.3 GB active/token -> roofline ~70 tok/s. NVIDIA's blessed small Spark model.
MODEL="nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4"
SERVED_NAME="nemotron-3-nano"
NODES=1
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --max-model-len 131072
  --max-num-seqs 16
  # NVFP4 MoE via CUTLASS silently produces garbage on sm_121; Marlin is the
  # validated backend (upstream + prior art on this box).
  --moe-backend marlin
)
CONTAINER_ENV=(
  "VLLM_MARLIN_USE_ATOMIC_ADD=1"
)
# MTP head is in the checkpoint (num_nextn_predict_layers=1); opt-in only:
SPEC_DECODE_ARGS=(
  --speculative-config '{"method":"mtp","num_speculative_tokens":1}'
)
STATUS="untested"
