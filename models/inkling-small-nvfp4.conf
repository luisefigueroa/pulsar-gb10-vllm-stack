# Thinkingmachines Inkling-Small-NVFP4 — added to the NFS catalog 2026-07-31.
# 170.7 GB ModelOpt NVFP4 (audio/visual modules unquantized), 42 layers,
# 256-expert MoE (6 active + 2 shared), multimodal, 1M-token config.
# The SECOND catalog model that fits this cluster, and the first needing
# both nodes (TP=2, ~85 GB/node).
#
# IMAGE: use the published PR-41834 image — Inkling NVFP4 loading (#49258) merged
# upstream AFTER the v0.26.0 cut, so the stock image cannot load it.
MODEL="/mnt/Models/Official Models/Thinkingmachines/Inkling-Small-NVFP4"
SERVED_NAME="inkling-small"
IMAGE="ghcr.io/luisefigueroa/pulsar-gb10-vllm-stack@sha256:260c854707e8e6db5001838998e390011b648f127bd42aa8705ad7a808fbe9e2"
NODES=2
TOPOLOGY_CLASS="roce-full-mesh"
MIN_RAILS_PER_PAIR=2
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --trust-remote-code
  --tensor-parallel-size 2
  --max-model-len 131072        # validation length; 1M configured, needle-gate first
  --max-num-seqs 8
  --max-num-batched-tokens 8192
  # NO global --moe-backend pin: Inkling's excluded (unquantized) multimodal
  # MoE modules reject marlin ("not supported for unquantized MoE"). Backend
  # selection is auto, VERIFIED at boot from engine logs and gated by the
  # battery (captures/gsm8k catch silently-wrong kernels).
  --enable-prefix-caching
  --distributed-executor-backend mp
)
CONTAINER_ENV=(
  # Inkling's fused Lamport reduce-scatter+sconv op hard-requires MNNVL
  # fabric for cross-node TP and refuses RoCE; =0 selects the standard
  # fallback path (vllm/models/inkling/nvidia/ops/lamport.py:750).
  "LAMPORT_RS_SCONV=0"
)
# Checkpoint ships an 8-layer MTP head (mtp.safetensors, 4.5 GB). No DSpark
# drafter exists for this architecture. Draft moe_backend=triton preempts
# the marlin-vs-unquantized-draft crash (same class as Super MTP draft).
SPEC_DECODE_ARGS=(
  --speculative-config '{"method":"mtp","num_speculative_tokens":2,"moe_backend":"triton"}'
)
STATUS="blocked-upstream"
NOTES="BLOCKED on GB10 2026-07-31: Inkling NVIDIA impl hardwires FA4/CuTe rel-bias attention; its sm_12x kernel asserts 'Paged KV not supported on SM 12.0 in this PR' (TP-independent — blocks ANY GB10 config). No fallback path exists (common/ has no reference attention; --attention-backend never reaches this code). LAMPORT_RS_SCONV=0 solved wall #2 of 3. Track upstream FA4-cute sm12x paged-KV; retest on next flagship image bump."
