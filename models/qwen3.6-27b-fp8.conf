# Qwen3.6-27B-FP8 — official Qwen 27B hybrid (16 full-attn + 48 GDN linear-attn layers, no MoE), FP8 (~29 GB).
# Decode roofline on GB10: ~240 GB/s / ~28 GB active = ~8.5 tok/s single-stream.
MODEL="Qwen/Qwen3.6-27B-FP8"
SERVED_NAME="qwen3.6-27b-fp8"
NODES=1
PORT=8000
GPU_MEM_UTIL=0.85
ENGINE_ARGS=(
  --max-model-len 131072
  --max-num-seqs 16
)
# If the engine aborts with "Failed to find a kernel ... ScaledMM", add:
#   CONTAINER_ENV+=("VLLM_TEST_FORCE_FP8_MARLIN=1")
# (needed on cu129-era images; v0.26.0/cu130 ships sm_121-family FP8 kernels)
#
# ngram spec decode: no extra weights, pure prompt-lookup drafting. Opt-in
# until the A/B in docs/VALIDATION.md shows it faster AND lossless here.
SPEC_DECODE_ARGS=(
  --speculative-config '{"method":"ngram","num_speculative_tokens":4,"prompt_lookup_min":2,"prompt_lookup_max":5}'
)
STATUS="untested"
