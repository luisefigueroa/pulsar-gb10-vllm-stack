# Qwen3.6-27B-FP8 — official Qwen dense 27B, FP8 checkpoint (~29 GB).
# Decode roofline on GB10: ~240 GB/s / ~28 GB active = ~8.5 tok/s single-stream.
MODEL="Qwen/Qwen3.6-27B-FP8"
SERVED_NAME="qwen3.6-27b-fp8"
NODES=1
PORT=8000
GPU_MEM_UTIL=0.85
ENGINE_ARGS=(
  --max-model-len 131072
  --max-num-seqs 16
)
