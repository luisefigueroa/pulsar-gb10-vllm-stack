# DeepSeek-V4-Flash-DSpark (checkpoint with the DSpark draft) + upstream
# in-tree dspark speculative method, on the PR #41834 source build.
# A/B config for docs/VALIDATION.md — NOT a production target until it
# beats the non-spec base AND passes the byte-identical single-stream gate.
MODEL="deepseek-ai/DeepSeek-V4-Flash-DSpark"
SERVED_NAME="deepseek-v4-flash-dspark"
IMAGE="vllm-gb10:pr41834-dspark-opt-v1"
IMAGE_KIND="openai"
NODES=2
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --trust-remote-code
  --tensor-parallel-size 2
  --kv-cache-dtype fp8
  --block-size 256
  --max-model-len 131072
  --max-num-seqs 8
  --max-num-batched-tokens 8192
  --enable-prefix-caching
  --distributed-executor-backend mp
)
CONTAINER_ENV=(
  "VLLM_DSPARK_FORWARD_CUDAGRAPH=1"
  "VLLM_DSPARK_FORWARD_CUDAGRAPH_ALLOW_TP=1"
)
SPEC_DECODE_ARGS=(
  --speculative-config '{"method":"dspark","num_speculative_tokens":5}'
)
STATUS="tested"
NOTES="RECOMMENDED FLAGSHIP MODE since 2026-07-31: +79% c=1, all gates earned incl. 150-min spec-on soak (3440 req, 0 err). Launch with cluster/start-cluster.sh deepseek-v4-flash-dspark --spec-decode."
