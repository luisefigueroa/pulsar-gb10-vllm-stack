# DeepSeek-V4-Flash on UPSTREAM-LINEAGE source build (branch upstream-dsv4-sm121).
#
# Image: vllm-gb10:pr41834-d64074e6f — vLLM PR #41834 head (the
# DeepSeek-V4-Flash-on-SM12x path proposed for main; community-validated on
# 2x GB10), source-built locally with torch_cuda_arch_list=12.0 (12.0f
# family covers sm_121 under CUDA 13). Build recipe in docs/BUILD.md.
#
# Purpose: replace the opaque sparkrun image with main-track lineage.
# Stock v0.26.0 is NOT viable for this model (kernel livelock — see
# VALIDATION.md "Stock-image DeepSeek-V4 probe series").
MODEL="deepseek-ai/DeepSeek-V4-Flash"
SERVED_NAME="deepseek-v4-flash"
IMAGE="vllm-gb10:pr41834-d64074e6f"
IMAGE_KIND="openai"
NODES=2
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --trust-remote-code
  --tensor-parallel-size 2
  --kv-cache-dtype fp8          # required by the DSV4 fp8_ds_mla KV layout
  --block-size 256
  --max-model-len 131072        # validation length; extend after needle gates
  --max-num-seqs 8
  --max-num-batched-tokens 8192
  --enable-prefix-caching
  --distributed-executor-backend mp
)
# If the engine wedges under load with CUDA graphs (upstream #46253-class),
# retry with VLLM_EXTRA_ARGS="--enforce-eager" and record the delta.
STATUS="untested"
NOTES="2-node only; upstream-lineage candidate to replace sparkrun image"
