# DeepSeek-V4-Flash — CANONICAL FLAGSHIP. Since 2026-07-31 this conf serves
# the 0731 refresh (deepseek-ai/DeepSeek-V4-Flash-0731): same architecture
# (DeepseekV4ForCausalLM, 43 layers, 166.9 GB FP8+FP4), with the DSpark
# drafter BUILT INTO the checkpoint (dspark_block_size 5, markov_rank 256,
# target layers 40-42) — one artifact replaces the old base+DSpark pair.
#
# Image: vllm-gb10:pr41834-d64074e6f — vLLM PR #41834 head (the
# DeepSeek-V4-Flash-on-SM12x path proposed for main), source-built locally
# with torch_cuda_arch_list=12.0. Build recipe in docs/BUILD.md. Stock
# v0.26.0 is NOT viable for this model (kernel livelock — see
# VALIDATION.md "Stock-image DeepSeek-V4 probe series").
#
# Promotion evidence (docs/VALIDATION.md): full parity battery vs the 0422
# incumbent (base 27.15 tok/s, gsm8k 0.935, needle 3/3 @447K on a 500K
# boot) + 150-min spec-on swap soak (3951 req, 0 errors, 29.5% acceptance
# flat). Fallbacks: deepseek-v4-flash-0422.conf (previous checkpoint,
# same image), deepseek-v4-flash-sparkrun.conf (community binary).
MODEL="deepseek-ai/DeepSeek-V4-Flash-0731"
SERVED_NAME="deepseek-v4-flash"
IMAGE="vllm-gb10:pr41834-d64074e6f"
IMAGE_KIND="openai"
NODES=2
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --trust-remote-code
  --tensor-parallel-size 2
  --kv-cache-dtype fp8          # required by the DSV4 fp8_ds_mla KV layout
  --block-size 256
  --max-model-len 500000        # needle-gated 3/3 @447K at THIS geometry (2026-07-31)
  # Explicit KV budget: 10 GB/rank -> 577,640-token capacity (1.16x @ 500K).
  # Bytes/token is GEOMETRY-DEPENDENT on DSV4 (~18 KB/tok at 500K ctx vs
  # ~55 KB effective at 131K — length-scaled tail compress_ratios), so this
  # number was measured at THIS max-model-len; never carry it across
  # geometries. WARNING: kv-cache-memory-bytes SKIPS vLLM memory profiling
  # and trusts a page-cache-inflated "free memory" reading on unified
  # memory — 27.5 GB here OOM-killed node 2 in warmup (NV_ERR_NO_MEMORY,
  # VALIDATION.md). Resize only with the memory-gated procedure there.
  --kv-cache-memory-bytes 10000000000
  --max-num-seqs 8
  --max-num-batched-tokens 8192
  --enable-prefix-caching
  --distributed-executor-backend mp
)
# RECOMMENDED MODE: DSpark k=5 via the integrated drafter (+~60% c=1 over
# base decode at natural-prompt acceptance; soak-proven). Opt in with
# `cluster/start-cluster.sh deepseek-v4-flash --spec-decode`.
SPEC_DECODE_ARGS=(
  --speculative-config '{"method":"dspark","num_speculative_tokens":5}'
)
STATUS="tested"
NOTES="PROMOTED 2026-07-31 (checkpoint 0731): parity battery + 150-min spec-on soak (3951 req/0 err, 29.5% acc flat, node mem drift <1 GiB, no throttle). 500K-token KV geometry validated same day: 577,640-token capacity, needle 3/3 @447K, gsm8k 0.925 (band), 20-min smoke 518 req/0 err, ~17 GiB OS headroom both nodes. DSpark k=5 recommended (--spec-decode). Fallbacks: deepseek-v4-flash-0422.conf, deepseek-v4-flash-sparkrun.conf"
