# DeepSeek-V4-Flash — 284B/A13B MoE, FP8+FP4, 160 GB. The 2-node flagship:
# does not fit one node; TP=2 across the RoCE link is the validated layout.
#
# Upstream vLLM has NO working sparse-MLA/DSA attention on sm_121 (#45317), so
# this runs on the community sparkrun image, production-validated on this
# cluster (500K ctx, TP=2, MTP). Roofline 2-node: ~11.5 GB active/token/node
# span -> ~40 tok/s theoretical, ~27-50 tok/s observed in prior runs.
MODEL="deepseek-ai/DeepSeek-V4-Flash"
SERVED_NAME="deepseek-v4-flash"
IMAGE="aidendle94/sparkrun-vllm-ds4-gb10:production-ready"
IMAGE_KIND="dsv4"              # custom entrypoint (dsv4-vllm-entrypoint)
NODES=2
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --trust-remote-code
  --tensor-parallel-size 2
  --kv-cache-dtype fp8
  --block-size 256
  --max-model-len 500000       # validated; 1M claimed by config, untested here
  --max-num-seqs 8
  --max-num-batched-tokens 8192
  --enable-prefix-caching
  --tokenizer-mode deepseek_v4
  --tool-call-parser deepseek_v4 --enable-auto-tool-choice
  --reasoning-parser deepseek_v4
  --enable-flashinfer-autotune
  --distributed-executor-backend mp
)
CONTAINER_ENV=(
  # GB10 kernel selection for this image (from the validated production script)
  "VLLM_USE_B12X_MOE=1"
  "VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256"
  "VLLM_ALLOW_LONG_MAX_MODEL_LEN=1"
  "TORCH_CUDA_ARCH_LIST=12.1a"
  "FLASHINFER_CUDA_ARCH_LIST=12.1a"
  # NCCL exactly as validated with this stack (single rail + explicit GID).
  # Overrides the dual-rail default from cluster-env.sh; dual rail is NOT yet
  # validated with this image.
  "NCCL_IB_HCA=rocep1s0f0"
  "NCCL_IB_GID_INDEX=3"
  "NCCL_IGNORE_CPU_AFFINITY=1"
)
# MTP (checkpoint ships the head). Validated in prior production use at k=2.
SPEC_DECODE_ARGS=(
  --speculative-config '{"method":"mtp","num_speculative_tokens":2}'
)
STATUS="untested"
NOTES="2-node only; start via cluster/start-cluster.sh deepseek-v4-flash"
