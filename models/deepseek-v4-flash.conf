# DeepSeek-V4-Flash — CANONICAL FLAGSHIP. Since 2026-07-31 this conf serves
# the 0731 refresh (deepseek-ai/DeepSeek-V4-Flash-0731): same architecture
# (DeepseekV4ForCausalLM, 43 layers, 166.9 GB FP8+FP4), with the DSpark
# drafter BUILT INTO the checkpoint (dspark_block_size 5, markov_rank 256,
# target layers 40-42) — one artifact replaces the old base+DSpark pair.
#
# Image: published, digest-pinned arm64 build of vLLM PR #41834 head (the
# DeepSeek-V4-Flash-on-SM12x path proposed for main); the published
# image was source-built with torch_cuda_arch_list=12.0. Reproducible build
# recipe in docs/BUILD.md. Stock
# v0.26.0 is NOT viable for this model (kernel livelock — see
# VALIDATION.md "Stock-image DeepSeek-V4 probe series").
#
# Promotion evidence (docs/VALIDATION.md): full parity battery vs the
# superseded 04-22 checkpoint (base 27.15 tok/s, gsm8k 0.935, needle 3/3
# @447K on a 500K boot) + 150-min spec-on swap soak (3951 req, 0 errors, 29.5% acceptance
# flat). The older profile has been retired from the live catalog.
#
# ---------------------------------------------------------------------------
# Workload these defaults are optimized for (2026-08-01)
# ---------------------------------------------------------------------------
# Pattern: FEW long agent sessions, not high-QPS short chat.
#   - ~4 concurrent sessions realistic, hard ceiling 5 (Hermes + at most
#     2–3 sub-agents only when main sessions are idle)
#   - Sessions are LONG: many tool calls, reading code, repo summarization
#   - Client-side context capped at the official 500K max — recall drops
#     past that; do not raise max-model-len to chase 1M on this box
#   - NOT optimized for: 8–16 concurrent short chats, aggregate tok/s at
#     high c, or "fill all free unified memory with KV"
#
# Geometry implications of that pattern:
#   - max-model-len 500000  — hard cap = model’s useful long-context band
#   - max-num-seqs 5        — match real concurrency; raising this without
#                            more KV just invites preemption under deep ctx
#   - max-num-batched-tokens 16384 — larger prefills (code/repo chunks)
#   - kv-cache-memory-bytes 20 GB/rank — long-session pool. Measured on
#     boot 2026-08-01: reserved 18.63 GiB → GPU KV cache size 652,465
#     tokens, max concurrency @500K = 1.30x (NOT linear from the old
#     10 GB→577k figure — bytes/token is geometry-dependent). Fits one
#     full 500K session + ~150K of other live context, or several medium-
#     long sessions; not 4×500K.
#
# Memory landmines (GB10 unified LPDDR5X, 121 GiB/node):
#   - kv-cache-memory-bytes SKIPS vLLM profiling and can trust page-cache-
#     inflated "free memory". 27.5 GB/rank OOM-killed node 2 during
#     attention warmup (NV_ERR_NO_MEMORY) — do NOT jump toward that.
#   - With kv_cache_memory_bytes set, gpu-memory-utilization does NOT size
#     the KV pool (it is not a second knob for "more cache").
#   - Bytes/token is GEOMETRY-DEPENDENT on DSV4 (~18 KB/tok at 500K max-
#     model-len vs ~55 KB effective at 131K). Never port token-capacity
#     numbers across max-model-len changes.
#   - Prior soaked geometry: 10 GB/rank -> 577,640-token capacity, needle
#     3/3 @447K, 20-min c=8 smoke clean (VALIDATION.md). 20 GB is a
#     deliberate step for the long-session pattern; re-confirm boot "GPU
#     KV cache size" line + soak after any further resize.
#   - 10 GB + max-num-batched-tokens 16384 failed init on this image: one
#     500K sequence required ~15.66 GiB KV floor. 20 GB clears that floor
#     with multi-session headroom.
MODEL="deepseek-ai/DeepSeek-V4-Flash-0731"
SERVED_NAME="deepseek-v4-flash"
IMAGE="ghcr.io/luisefigueroa/pulsar-gb10-vllm-stack@sha256:260c854707e8e6db5001838998e390011b648f127bd42aa8705ad7a808fbe9e2"
NODES=2
TOPOLOGY_CLASS="roce-full-mesh"
MIN_RAILS_PER_PAIR=2
PORT=8000
GPU_MEM_UTIL=0.80
ENGINE_ARGS=(
  --trust-remote-code
  --tensor-parallel-size 2
  --kv-cache-dtype fp8          # required by the DSV4 fp8_ds_mla KV layout
  --block-size 256
  --max-model-len 500000        # official useful max; client sessions should cap here too
  # 20 GB/rank: long-session multi-agent pool (see header). Stay well below
  # the 27.5 GB OOM. Resize only in steps with drop_caches + boot line + soak.
  --kv-cache-memory-bytes 20000000000
  --max-num-seqs 5              # ≤5 concurrent long sessions (not high-QPS chat)
  --max-num-batched-tokens 16384  # larger code/repo prefills; needs KV ≥ ~16 GiB @ 500K
  --enable-prefix-caching       # helps shared repo prefixes across tool/sub-agent turns
  # OpenAI tool-calling. Without these the server 400s any request carrying
  # tool_choice ("auto" tool choice requires --enable-auto-tool-choice and
  # --tool-call-parser to be set). Parser name verified registered in THIS
  # image: vllm/tool_parsers/__init__.py maps "deepseek_v4" ->
  # DeepSeekV4EngineToolParser (an adapter over vllm.parser.deepseek_v4,
  # the DSML <｜DSML｜tool_calls> state machine).
  #
  # The reasoning parser is NOT optional cosmetics here — it is coupled to
  # the tool parser by two mechanics in this build:
  #   1. ParserEngine.adjust_request() forces skip_special_tokens=False, so
  #      once the tool parser is on, <think>/</think> stop being stripped by
  #      the detokenizer and would land verbatim in message.content.
  #   2. ParserEngineToolAdapter.extract_tool_calls_from_content() starts the
  #      engine in ParserState.CONTENT — it is documented as consuming
  #      reasoning-STRIPPED content, i.e. the output of the reasoning parser.
  # Both names resolve to the same DeepSeekV4Parser engine; ship them as a
  # pair. Effect on the API contract: reasoning moves out of content into
  # message.reasoning_content.
  #
  # Official recipe + agent clients (Hermes): pair tokenizer mode with the
  # tool/reasoning parsers. This image also auto-selects
  # tokenizer_mode=deepseek_v4, but pin it explicitly so restarts never
  # drift. Checkpoint ships no Jinja chat template — encoding/ +
  # vllm/tokenizers/deepseek_v4_encoding.py render tools (render_tools)
  # and fold role:"tool" turns (merge_tool_messages).
  --tokenizer-mode deepseek_v4
  --enable-auto-tool-choice
  --tool-call-parser deepseek_v4
  --reasoning-parser deepseek_v4
  --distributed-executor-backend mp
)
# DEFAULT MODE: the integrated DSpark drafter is soak-proven and adds ~60% c=1
# decode throughput over base at natural-prompt acceptance.
#
# INVARIANT: num_speculative_tokens MUST equal the checkpoint's
# dspark_block_size=5. This is checkpoint structure, not a tuning knob: larger
# values draft unreachable positions and reduce acceptance. Changing it requires
# a different checkpoint/upstream contract plus full revalidation.
SPEC_DECODE_ARGS=(
  --speculative-config '{"method":"dspark","num_speculative_tokens":5}'
)
STATUS="tested"
RECOMMENDED_SPEC=1
# Memory preflight budgets (GiB).
# WEIGHTS_GIB     = full HF disk tree (pull-weights space gate)
# WEIGHTS_RAM_GIB = full-model resident weights in unified memory (check-memory
#                   splits /2 for TP=2). Calibrated dogfood 2026-08-02: warm
#                   residual ~7 GiB ⇒ ~106 GiB/node with KV 20 + overhead 8.
WEIGHTS_GIB=167
WEIGHTS_RAM_GIB=156
KV_GIB=20
OVERHEAD_GIB=8
MEM_MIN_FREE_GIB=6
NOTES="Workload defaults 2026-08-01: few long agent sessions (≤5 concurrent, 500K client cap, tools/code/repos) -> kv 20GB/rank, max-num-seqs 5, batch 16384, max-model-len 500K, tool+reasoning parsers. Boot-measured: 18.63 GiB reserved → 652,465-token KV, 1.30x @500K; warmup 8/8 ok; MemAvailable ~7 GiB both nodes under this geometry (tighter than 10GB's ~17 GiB — watch OS headroom). WEIGHTS_GIB=disk; WEIGHTS_RAM_GIB=resident. Prior soaked ref: 10GB/577k-tok + seqs 8 + batch 8192 (needle 3/3 @447K, 150-min soak). Stay below 27.5GB OOM. DSpark is default-on; k=5 is fixed by dspark_block_size. Roll back with --no-spec-decode."
